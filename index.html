<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lector de etiquetas</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}body{background:#101827;color:#f5f7fa;margin:0;padding:18px}
main{max-width:570px;margin:auto}h1{font-size:1.6rem}p{color:#cbd5e1}
button,input{font:inherit}button{background:#38bdf8;color:#061525;border:0;border-radius:9px;padding:13px;margin:5px 5px 5px 0;font-weight:700}
button:disabled{opacity:.4}video{width:100%;background:#000;border-radius:12px;display:block}
.frame{position:relative}.guide{position:absolute;left:12%;right:12%;top:34%;height:32%;border:3px solid #4ade80;border-radius:9px;pointer-events:none}
.result{background:#1e293b;padding:15px;border-radius:12px;margin-top:12px}#code{font-size:2.5rem;letter-spacing:.22em;font-weight:800;display:block}
#status{min-height:1.5em}#photo{display:none}label{display:inline-block;background:#334155;border-radius:9px;padding:13px;margin:5px 0;font-weight:700;cursor:pointer}
small{color:#94a3b8}#history{overflow-wrap:anywhere}
</style></head><body><main>
<h1>Lector de etiquetas · 5 números</h1>
<p>Colocá una sola etiqueta, aproximadamente derecha, dentro del recuadro verde. La cámara queda encendida entre lecturas.</p>
<div class="frame"><video id="video" autoplay muted playsinline></video><div class="guide" id="guide" hidden></div></div>
<button id="start">Encender cámara</button><button id="scan" disabled>Leer etiqueta</button><button id="stop" disabled>Apagar cámara</button>
<br><label for="photo">Elegir o sacar foto</label><input id="photo" type="file" accept="image/*" capture="environment">
<div class="result"><div id="status" role="status">Listo para comenzar.</div><span id="code">-----</span>
<button id="confirm" disabled>Confirmar código</button><button id="retry">Nueva lectura</button>
<p><small>Si la lectura es incorrecta, corregí los cinco números antes de confirmar.</small></p>
<input id="edit" type="text" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="Corregir número" aria-label="Código corregido" style="padding:12px;width:150px;border-radius:8px">
<div id="history"></div></div>
<canvas id="canvas" hidden></canvas>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let stream=null, worker=null, busy=false;
function status(s){$('status').textContent=s}
function setCode(s){$('code').textContent=s||'-----';$('edit').value=s||'';$('confirm').disabled=!/^\d{5}$/.test(s)}
async function initOCR(){
 if(worker)return worker;
 if(!window.Tesseract)throw Error('No se pudo cargar el motor OCR. Revisá la conexión a Internet.');
 status('Preparando reconocimiento por primera vez...');
 worker=await Tesseract.createWorker('eng',1);
 await worker.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:Tesseract.PSM.SINGLE_LINE});
 return worker;
}
async function start(){
 try{
 if(!navigator.mediaDevices?.getUserMedia)throw Error('La cámara requiere HTTPS y un navegador compatible.');
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
 $('video').srcObject=stream;await $('video').play();
 $('guide').hidden=false;$('scan').disabled=false;$('stop').disabled=false;$('start').disabled=true;
 status('Cámara lista. Centrá la etiqueta y tocá Leer etiqueta.');
 }catch(e){status('No se pudo abrir la cámara: '+e.message)}
}
function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('guide').hidden=true;$('scan').disabled=true;$('stop').disabled=true;$('start').disabled=false;status('Cámara apagada.')}
function processCanvas(source,fromVideo){
 const c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
 let sw=source.videoWidth||source.naturalWidth,sh=source.videoHeight||source.naturalHeight;
 if(!sw||!sh)throw Error('La imagen no está disponible.');
 // En vivo, la guía ocupa la zona central; en fotos se procesa la imagen completa.
 let sx=0,sy=0,cw=sw,ch=sh;
 if(fromVideo){sx=sw*.12;sy=sh*.34;cw=sw*.76;ch=sh*.32}
 const scale=Math.min(3,1800/cw);
 c.width=Math.round(cw*scale);c.height=Math.round(ch*scale);
 ctx.drawImage(source,sx,sy,cw,ch,0,0,c.width,c.height);
 const data=ctx.getImageData(0,0,c.width,c.height),a=data.data;
 // Escala de grises y contraste: funciona con fondos verdes y naranjas.
 let lo=255,hi=0;const gr=new Uint8Array(a.length/4);
 for(let i=0,j=0;i<a.length;i+=4,j++){let v=Math.round(.299*a[i]+.587*a[i+1]+.114*a[i+2]);gr[j]=v;lo=Math.min(lo,v);hi=Math.max(hi,v)}
 const span=Math.max(1,hi-lo);
 for(let i=0,j=0;i<a.length;i+=4,j++){let v=Math.max(0,Math.min(255,Math.round((gr[j]-lo)*255/span)));a[i]=a[i+1]=a[i+2]=v}
 ctx.putImageData(data,0,0);return c;
}
async function recognize(source,fromVideo){
 if(busy)return;busy=true;$('scan').disabled=true;$('confirm').disabled=true;setCode('');
 try{
 const w=await initOCR();status('Leyendo en una sola orientación...');
 const c=processCanvas(source,fromVideo);
 const r=await w.recognize(c);
 const raw=(r.data.text||'').replace(/\s/g,'');
 const matches=raw.match(/\d{5}/g)||[];
 if(matches.length===1&&raw.replace(/\D/g,'').length===5){
 setCode(matches[0]);status('Lectura propuesta. Verificá los cinco números antes de confirmar.');
 }else{status('No se obtuvo un código único de cinco números. Acercá la etiqueta, mejorá la luz o corregilo manualmente.');}
 }catch(e){status('Error de lectura: '+e.message)}
 finally{busy=false;$('scan').disabled=!stream}
}
$('start').onclick=start;$('stop').onclick=stop;
$('scan').onclick=()=>{if(stream)recognize($('video'),true)};
$('photo').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 const url=URL.createObjectURL(file),im=new Image();
 try{await new Promise((ok,fail)=>{im.onload=ok;im.onerror=fail;im.src=url});await recognize(im,false)}
 finally{URL.revokeObjectURL(url);e.target.value=''}
};
$('edit').oninput=()=>{const s=$('edit').value.replace(/\D/g,'').slice(0,5);$('edit').value=s;$('code').textContent=s||'-----';$('confirm').disabled=!/^\d{5}$/.test(s)};
$('confirm').onclick=()=>{
 const s=$('edit').value;if(!/^\d{5}$/.test(s))return;
 const d=document.createElement('div');d.textContent='Confirmado: '+s;$('history').prepend(d);
 status('Código confirmado. Podés leer otra etiqueta.');setCode('');
};
$('retry').onclick=()=>{setCode('');status(stream?'Cámara lista para otra lectura.':'Elegí una foto o encendé la cámara.')};
</script></body></html>
